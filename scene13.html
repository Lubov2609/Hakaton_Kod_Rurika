<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сцена 11</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="scene13">
<!-- TOP UI -->
<div class="top-ui">
    <div class="left-ui">
        <a href="quest6.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>


   <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
        <a href="profile.html" class="ui-btn btn-menu"></a>

    </div>

</div>
<!-- ПЕРСОНАЖ -->
<div class="person left-person">
    <img src="assets/rur_scene11.png" class="char-img">

    <div class="speech left-text">
        <span id="text1"></span>
    </div>
</div>

<!-- НАГРАДА -->
<img src="assets/med.png" class="reward-chest">

<!-- ПРАВЫЙ ПЕРСОНАЖ -->
<div class="person right-person">
    <img src="assets/vova_scene6.png" class="char-img">
</div>
<script>

const text = "Отлично, второй ингредиент у тебя.";
let i = 0;

function typeText() {

    const el = document.getElementById("text1");

    let interval = setInterval(() => {
        el.innerHTML += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(interval);

            setTimeout(() => {
                window.location.href = "final_test.html";
            }, 3000);
        }

    }, 25);
}

window.onload = typeText;

</script>

</body>
</html>
