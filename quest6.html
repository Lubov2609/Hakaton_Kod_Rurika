<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Сцена</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ancient-style.css">
</head>

<body class="quest6">

<!-- AUDIO -->
<audio id="bgSound" loop>
    <source src="assets/village.mp3" type="audio/mpeg">
</audio>

<!-- TOP UI -->
<div class="top-ui">

    <div class="left-ui">
        <a href="quest1.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
        <div class="ui-btn btn-menu" onclick="toggleMenu()"></div>
    </div>

</div>

<!-- MENU -->
<div id="menu" class="menu-overlay">
    <div class="menu-box">
        <h2>Меню</h2>

        <button onclick="resumeGame()">Продолжить</button>
        <button onclick="goHome()">На главную</button>
        <button onclick="restart()">Заново</button>
    </div>
</div>

<!-- ЛЕВЫЙ ПЕРСОНАЖ -->
<div class="person left-person">
    <img src="assets/rurik_quest6.png" class="char-img">

    <div class="speech left-text">
        <span id="text1"></span>
    </div>
</div>

<!-- ПРАВЫЙ ПЕРСОНАЖ -->
<div class="person right-person">
    <img src="assets/vova_862.png" class="char-img">
</div>

<!-- КНОПКА -->
<button id="choiceBtn" class="choices-btn" onclick="openDecisionGame()" disabled>
    Собрать Терпкость
</button>

<!-- ================= МИНИ-ИГРА ================= -->
<div id="stackGame" class="dg-overlay" style="display:none;">
    <div class="dg-window">

        <div class="dg-close" onclick="closeGame()">✖</div>

        <h2>Башня сундуков</h2>
        <h3>Собери башню правильно</h3>

        <!-- БАШНЯ -->
        <div id="stackBoard" class="stack-board"></div>

        <!-- КНОПКИ -->
        <div class="actions">
            <button onclick="pushChest(1)">Поставить сундук 1</button>
            <button onclick="pushChest(2)">Поставить сундук 2</button>
            <button onclick="pushChest(3)">Поставить сундук 3</button>
            <button onclick="popChest()">Взять сундук</button>
        </div>

    </div>
</div>

<!-- POPUP -->
<div id="resultPopup" class="dg-overlay" style="display:none;">
    <div class="dg-window" id="resultContent"></div>
</div>

<audio id="successSound" src="assets/medal.mp3"></audio>

<script>

// ===== ЗВУК =====
const sound = document.getElementById("bgSound");
const soundBtn = document.getElementById("soundBtn");

let unlocked = localStorage.getItem("audioUnlocked") === "true";

if (unlocked) {
    sound.play().catch(()=>{});
}

let soundEnabled = localStorage.getItem("sound") !== "off";

window.addEventListener("click", () => {
    if (soundEnabled) {
        sound.volume = 0.5;
        sound.play();
    }
}, { once: true });

function updateSoundUI() {
    soundBtn.src = soundEnabled
        ? "assets/sound-on.png"
        : "assets/sound-off.png";
}

updateSoundUI();

function toggleSound() {
    soundEnabled = !soundEnabled;

    if (soundEnabled) {
        sound.play();
    } else {
        sound.pause();
    }

    localStorage.setItem("sound", soundEnabled ? "on" : "off");
    updateSoundUI();
}

// ===== МЕНЮ =====
function toggleMenu() {
    menu.classList.toggle("show");
}

function resumeGame() {
    toggleMenu();
}

function goHome() {
    window.location.href = "index.html";
}

function restart() {
    window.location.reload();
}

// ===== ПЕЧАТАЮЩИЙСЯ ТЕКСТ =====
const textLeft = " Я Роланд — хранитель летописей.  Тебе предстоит собрать  Квас времени: Терпкость — Стеком,  Сладость — Очередью, Крепость — Связкой.  Сделаешь ингредиенты — вернёшься домой. нет — останешься здесь.";
let speed = 25;

function typeText(el, text, callback) {
    let i = 0;
    let interval = setInterval(() => {
        el.innerHTML += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(interval);
            if (callback) callback();
        }
    }, speed);
}

window.onload = () => {
    typeText(text1, textLeft, () => {
        choiceBtn.disabled = false;
        choiceBtn.classList.add("show");
    });
};

// пропуск
document.addEventListener("click", () => {
    text1.innerHTML = textLeft;
    choiceBtn.disabled = false;
    choiceBtn.classList.add("show");
});

// ================= ТВОЯ ЛОГИКА =================
/* ================= STACK GAME ================= */

let stack = [];
let steps = [];
let attempts = 0;

/* правильная последовательность */
const correct = [
    "push1",
    "push2",
    "pop",
    "push3",
    "pop",
    "pop"
];

/* открыть игру */
function openDecisionGame() {
    document.getElementById("stackGame").style.display = "flex";
    resetGame();
}

function closeGame() {
    document.getElementById("stackGame").style.display = "none";
    resetGame();
}

/* сброс */
function resetGame() {
    stack = [];
    steps = [];
    document.getElementById("stackBoard").innerHTML = "";
}

/* добавить сундук */
function pushChest(id) {

    stack.push(id);
    steps.push("push" + id);

    renderStack();
    checkProgress();
}

/* убрать сундук */
function popChest() {

    if (stack.length === 0) return;

    stack.pop();
    steps.push("pop");

    renderStack();
    checkProgress();
}

/* отрисовка */
function renderStack() {

    const board = document.getElementById("stackBoard");
    board.innerHTML = "";

    stack.forEach((id, index) => {
        const el = document.createElement("div");
        el.className = "chest";
        el.innerText = "Сундук " + id;

        if (index === stack.length - 1) {
            el.classList.add("top");
        }

        board.appendChild(el);

        setTimeout(() => el.classList.add("show"), 50);
    });
}

/* проверка */
function checkProgress() {

    for (let i = 0; i < steps.length; i++) {
        if (steps[i] !== correct[i]) {
            return showError();
        }
    }

    if (steps.length === correct.length) {
        return showSuccess();
    }
}

/* ошибка */
function showError() {

    attempts++;

    resultContent.innerHTML = `
        <h2>Ошибка</h2>
        <div class="hint-box">
            <p>Нарушен порядок действий</p>
            <p>Помни: брать можно только сверху</p>
        </div>
        <button onclick="closePopup(); resetGame()">Заново</button>
    `;

    resultPopup.style.display = "flex";
}

/* победа */
function showSuccess() {

    resultContent.innerHTML = `
        <h2>Отлично!</h2>
        <div class="hint-box">
            <p>Последний пришёл — первый ушёл</p>
            <p>Ты понял, как работает стек</p>
        </div>
        <button onclick="showReward()">Далее</button>
    `;

    resultPopup.style.display = "flex";
}
</script>

</body>
</html>
