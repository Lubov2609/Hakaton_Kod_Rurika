<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квест 2</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ancient-style.css">
</head>

<body class="quest2">

<audio id="bgSound" loop>
    <source src="assets/village.mp3" type="audio/mpeg">
</audio>

<div class="top-ui">
    <div class="left-ui">
        <a href="quest1.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
    </div>
</div>

<!-- ПЕРСОНАЖ -->
<div class="person left-person">
    <img src="assets/Rur_quest2.png" class="char-img">
    <div class="speech left-text">
        <span id="text1"></span>
    </div>
</div>

<div class="person right-person">
    <img src="assets/vova_quest2.png" class="char-img">
</div>

<!-- КНОПКА -->
<button id="choiceBtn" class="choices-btn" onclick="showTheory()" disabled>
    Помочь Новгородцам
</button>

<!-- ================= ТЕОРИЯ ================= -->
<div id="theoryModal" class="dg-overlay" style="display:none;">
    <div class="dg-window ancient-test">

        <h2>Свиток знаний</h2>

        <p><b>Ветвление</b> — это выбор действия по условию.</p>
        <p>Если условие истинно — выполняется один путь.</p>
        <p>Иначе — другой путь.</p>

        <p><b>Пример:</b></p>
        <p>Если враги — позвать Рюрика</p>
        <p>Иначе — справиться самим</p>

        <button class="test-next" onclick="startQuest()">
            Начать квест
        </button>

    </div>
</div>

<!-- ================= КВЕСТ ================= -->
<div id="decisionGame" class="dg-overlay" style="display:none;">
    <div class="dg-window">

        <h2>Помоги новгородцам</h2>

        <div class="dg-columns">

            <div class="dg-col">
                <p>Если враги одолевают</p>
                <button onclick="select(this,'left','call')">Позвать Рюрика</button>
                <button onclick="select(this,'left','self')">Сами</button>
            </div>

            <div class="dg-col">
                <p>Иначе</p>
                <button onclick="select(this,'right','call')">Позвать Рюрика</button>
                <button onclick="select(this,'right','self')">Сами</button>
            </div>

        </div>

        <button id="checkBtn" class="dg-check" onclick="check()" style="display:none;">
            Проверить
        </button>

    </div>
</div>

<!-- РЕЗУЛЬТАТ -->
<div id="resultPopup" class="dg-overlay" style="display:none;">
    <div class="dg-window" id="resultContent"></div>
</div>

<!-- ================= ТЕСТ ================= -->
<div id="testModal" class="dg-overlay" style="display:none;">
    <div class="dg-window ancient-test">

        <h2>Испытание мудреца</h2>
        <div>Время: <span id="testTime">0</span></div>

        <div id="testContent"></div>

    </div>
</div>

<audio id="successSound" src="assets/medal.mp3"></audio>

<script>

/* ================= ТЕКСТ ================= */
const textLeft = "Враги близко. Прими решение.";

let speed = 25;

function typeText(el, text, callback) {
    let i = 0;
    let interval = setInterval(() => {
        el.innerHTML += text[i++];
        if (i >= text.length) {
            clearInterval(interval);
            if (callback) callback();
        }
    }, speed);
}

window.onload = () => {
    typeText(text1, textLeft, () => {
        choiceBtn.disabled = false;
    });
};

/* ================= ЗВУК ================= */
const sound = document.getElementById("bgSound");
const soundBtn = document.getElementById("soundBtn");

let enabled = true;

function toggleSound(){
    enabled = !enabled;
    enabled ? sound.play() : sound.pause();
    soundBtn.src = enabled ? "assets/sound-on.png" : "assets/sound-off.png";
}

/* ================= ТЕОРИЯ ================= */

function showTheory(){
    theoryModal.style.display = "flex";
}

function startQuest(){
    theoryModal.style.display = "none";
    decisionGame.style.display = "flex";
}

/* ================= КВЕСТ ================= */

let ans = {};
let attempts = 0;

function select(btn, side, val){
    ans[side] = val;

    btn.parentNode.querySelectorAll("button")
    .forEach(b => b.classList.remove("active"));

    btn.classList.add("active");

    if(ans.left && ans.right){
        checkBtn.style.display = "block";
    }
}

function check(){
    if(ans.left === "call" && ans.right === "self"){
        reward();
    } else {
        fail();
    }
}

function fail(){
    attempts++;

    resultContent.innerHTML = `
        <h2>Ошибка</h2>
        <button onclick="closeResult()">OK</button>
    `;

    resultPopup.style.display = "flex";
}

function reward(){

    resultContent.innerHTML = `
        <h2>Верно!</h2>
        <button onclick="startTest()">Далее</button>
    `;

    resultPopup.style.display = "flex";
}

function closeResult(){
    resultPopup.style.display = "none";
}

/* ================= ТЕСТ ================= */

let q = 0;
let score = 0;

const questions = [
{
q:"Что такое ветвление?",
a:["Выбор","Повтор","Случайность"],
c:0
},
{
q:"Если условие ложно?",
a:["Другой путь","Стоп","Ошибка"],
c:0
}
];

function startTest(){
    resultPopup.style.display = "none";
    decisionGame.style.display = "none";
    testModal.style.display = "flex";
    render();
}

function render(){

    let x = questions[q];

    let html = `<h3>${x.q}</h3>`;

    x.a.forEach((a,i)=>{
        html += `<button onclick="pick(${i})">${a}</button>`;
    });

    html += `<button onclick="next()">Далее</button>`;

    testContent.innerHTML = html;
}

let pickAns = null;

function pick(i){
    pickAns = i;
}

function next(){

    if(pickAns === questions[q].c) score++;

    q++;

    if(q >= questions.length){
        finish();
    } else {
        render();
    }
}

function finish(){
    testContent.innerHTML = `<h2>Результат: ${score}</h2>`;

    setTimeout(()=>{
        window.location.href = "errors.html";
    },3000);
}

</script>

</body>
</html>
