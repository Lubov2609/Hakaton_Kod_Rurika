<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Код Рюрика — загрузка</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container" id="loader">
    <div class="logo-box">
        <img src="assets/logo.png" class="logo">
    </div>

    <h1>КОД РЮРИКА</h1>

    <div style="position:absolute; bottom:120px; width:100%; display:flex; flex-direction:column; align-items:center;">
        <div class="boat">
            <img src="assets/logo_start.png">
        </div>

        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
    </div>
</div>

<script>
let progress = 0;
const bar = document.getElementById('progress');

const interval = setInterval(() => {
    progress += Math.random() * 10;

    if (progress >= 100) {
        progress = 100;
        clearInterval(interval);

        setTimeout(() => {
            // переход на основную сцену
            window.location.href = "scene0.html";
        }, 500);
    }

    bar.style.width = progress + '%';
}, 200);
</script>

</body>
</html>
