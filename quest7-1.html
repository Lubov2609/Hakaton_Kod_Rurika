<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мини-игра: Очередь</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="scene13">



<!-- AUDIO -->
<audio id="bgSound" loop>
    <source src="assets/village.mp3" type="audio/mpeg">
</audio>

<audio id="successSound" src="assets/medal.mp3"></audio>

<!-- TOP UI -->
<div class="top-ui">
    <div class="left-ui">
        <a href="scene9.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
        <a href="profile.html" class="ui-btn btn-menu"></a>
    </div>
</div>

<!-- ЛЕВЫЙ ПЕРСОНАЖ -->
<div class="person left-person">
    <img src="assets/vova-quest7_1.png" class="char-img">

    <div class="speech left-text">
        <span id="text1"></span>
    </div>
</div>
<!-- АМУЛЕТ -->
<div class="amulet-block">
    <img src="assets/omylet.png" class="amulet-game">
    <div class="amulet-text">
Cоставь очередь правильно<br>

    </div>
</div>

<!-- КОРАБЛИ -->
<div class="chests">
    <img src="assets/kor_1.png" class="chest" draggable="true" data-id="1">
    <img src="assets/kor_2.png" class="chest" draggable="true" data-id="2">
    <img src="assets/kor_3.png" class="chest" draggable="true" data-id="3">
</div>

<!-- БАШНЯ -->
<div class="tower-container">
    <div id="queue" class="queue"></div>
    <img src="assets/ten_synd.png" class="image-under-tower">
</div>

<!-- POPUP -->
<div id="resultPopup" class="dg-overlay" style="display:none;">
    <div class="dg-window" id="resultContent"></div>
</div>

<audio id="successSound" src="assets/medal.mp3"></audio>

<script>
const queueEl = document.getElementById("queue");

// звуки
const placeSound = new Audio("assets/place.mp3");
const hitSound = new Audio("assets/hit.mp3");

let attempts = 0;

/* ===============================
   СТАРТОВЫЕ ЛОДКИ В РЯДУ
================================= */
queueEl.innerHTML = `
    <img src="assets/kor_1.png" class="queue-ship" data-id="1">
    <img src="assets/kor_2.png" class="queue-ship" data-id="2">
    <img src="assets/kor_3.png" class="queue-ship" data-id="3">
`;

/* ===============================
   НИЖНЯЯ ЛОДКА (НОВАЯ)
================================= */
const chests = document.querySelector(".chests");

chests.innerHTML = `
    <img src="assets/kor_4.png" id="newShip" class="chest" draggable="true">
`;

const newShip = document.getElementById("newShip");

/* ===============================
   DRAG NEW SHIP
================================= */
newShip.addEventListener("dragstart", (e) => {
    e.dataTransfer.setData("text/plain", "4");
});

queueEl.addEventListener("dragover", (e) => {
    e.preventDefault();
});

/* ===============================
   ДОБАВИТЬ ЛОДКУ СЛЕВА
================================= */
queueEl.addEventListener("drop", (e) => {
    e.preventDefault();

    if (document.querySelector('[data-id="4"]')) return;

    const ship = document.createElement("img");
    ship.src = "assets/kor_4.png";
    ship.className = "queue-ship";
    ship.dataset.id = "4";

    queueEl.prepend(ship); // 🔥 ставим слева

    newShip.style.display = "none";

    placeSound.currentTime = 0;
    placeSound.play();
});

/* ===============================
   УДАЛЕНИЕ ЛЮБОЙ ЛОДКИ
================================= */
queueEl.addEventListener("click", (e) => {

    if (!e.target.classList.contains("queue-ship")) return;

    hitSound.currentTime = 0;
    hitSound.play();

    e.target.remove();

    check();
});

/* ===============================
   ПРОВЕРКА
Правильно:
4 1 2 осталось
(3 удалили справа)
================================= */
function check() {

    const ships = [...queueEl.querySelectorAll(".queue-ship")]
        .map(el => el.dataset.id);

    if (ships.length !== 3) return;

    const correct =
        ships[0] === "4" &&
        ships[1] === "1" &&
        ships[2] === "2";

    if (correct) showReward();
    else showFail();
}

/* ===============================
   ОШИБКА
================================= */
function showFail() {

    attempts++;

    let text =
        attempts == 1 ? "Новая лодка встаёт первой слева." :
        attempts == 2 ? "Убрать нужно крайнюю справа." :
        "Попробуй позже";

    let button = attempts >= 3
        ? `<button onclick="exitGame()">Выйти</button>`
        : `<button onclick="location.reload()">Еще раз</button>`;

    resultContent.innerHTML = `
        <h2>Ошибка</h2>
        <div class="hint-box"><p>${text}</p></div>
        ${button}
    `;

    resultPopup.style.display = "flex";
}

/* ===============================
   НАГРАДА
================================= */
function showReward() {

    let img = attempts === 0
        ? "assets/medal-gold.png"
        : attempts === 1
        ? "assets/medal-silvers.png"
        : "assets/medal-bronse.png";

    resultContent.innerHTML = `
        <h2>Награда!</h2>
        <img src="${img}" class="result-img">

        <p>Очередь — структура данных</p>
        <p>Первый пришёл — первый ушёл (FIFO)</p>

        <button onclick="goNext()">Далее</button>
    `;

    resultPopup.style.display = "flex";

    successSound.currentTime = 0;
    successSound.play();
}

function exitGame() {
    location.reload();
}

function goNext() {
    window.location.href = "scene13.html";
}
</script>
</body>
</html>
