<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Профиль</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="profile-page">

<!-- TOP UI -->
<div class="top-ui">
    <div class="left-ui">
        <a href="index.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img class="sound-btn" src="assets/sound-on.png">
        <a href="profile.html" class="ui-btn btn-menu"></a>
    </div>
</div>

<!-- ОСНОВНОЙ ЭКРАН -->
<div class="profile-wrapper">

    <!-- ЛОГО -->
    <div class="profile-logo">
        <img src="assets/logo_menu.png" class="pr_logo-ship">
        <div class="pr_logo-text">КОД РЮРИКА</div>
    </div>

    <!-- КОНТЕНТ -->
    <div class="profile-content">

        <!-- ЛЕВАЯ КОЛОНКА -->
        <div class="profile-left">

            <img src="assets/default-avatar.png" class="avatar">

            <h2>Личный кабинет</h2>

            <div class="stats">
                <p>Попыток: <b id="attempts">0</b></p>
                <p>Лучший результат: <b id="best">—</b></p>
                <p>Время: <b id="time">—</b></p>
            </div>

        </div>

        <!-- ПРАВАЯ КОЛОНКА -->
        <div class="profile-right">

            <form onsubmit="event.preventDefault(); saveProfile()">

                <label>Фамилия</label>
                <input id="last_name" placeholder="Иванов">

                <label>Имя</label>
                <input id="first_name" placeholder="Иван">

                <label>Отчество</label>
                <input id="middle_name" placeholder="Иванович">

                <label>Email</label>
                <input id="email" type="email" placeholder="example@mail.com">

                <label>Новый пароль</label>
                <input id="password" type="password" placeholder="••••••">

                <label>Повторите пароль</label>
                <input id="password2" type="password" placeholder="••••••">

                <button class="save-btn">СОХРАНИТЬ</button>

            </form>

        </div>

    </div>

</div>

<script>
function saveProfile() {

    const data = {
        last: last_name.value,
        first: first_name.value,
        middle: middle_name.value,
        email: email.value
    };

    localStorage.setItem("profile", JSON.stringify(data));
    alert("Профиль сохранён");
}

window.onload = () => {

    let data = JSON.parse(localStorage.getItem("profile") || "{}");

    last_name.value = data.last || "";
    first_name.value = data.first || "";
    middle_name.value = data.middle || "";
    email.value = data.email || "";

    attempts.innerText = localStorage.getItem("attempts") || 0;
    best.innerText = localStorage.getItem("best") || "—";
    time.innerText = localStorage.getItem("time") || "—";
};
</script>

</body>
</html>
