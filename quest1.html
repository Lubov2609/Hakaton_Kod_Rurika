<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Квест 1</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="ancient-style.css">
</head>

<body class="quest1">

<!-- AUDIO -->
<audio id="bgSound" loop>
    <source src="assets/village.mp3" type="audio/mpeg">
</audio>

<!-- TOP UI -->
<div class="top-ui">
    <div class="left-ui">
        <a href="scene3.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>


   <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
        <a href="profile.html" class="ui-btn btn-menu"></a>

    </div>

</div>

<!-- MENU -->
<div id="menu" class="menu-overlay">
    <div class="menu-box">
        <h2>Меню</h2>
        <button onclick="resumeGame()">Продолжить</button>
        <button onclick="goHome()">На главную</button>
        <button onclick="restart()">Заново</button>
    </div>
</div>

<!-- ЛЕВЫЙ ПЕРСОНАЖ -->
<div class="person left-person">
    <img src="assets/ruric_quest1.png" class="char-img">

    <div class="speech left-text">
        <span id="text1"></span>
    </div>
</div>

<!-- ПРАВЫЙ ПЕРСОНАЖ -->
<div class="person right-person">
    <img src="assets/vova_quest1.png" class="char-img">
</div>

<!-- КНОПКА -->
<button id="choiceBtn" class="choices-btn" onclick="openOrderGame()" disabled>
    Получить задание
</button>

<!-- МИНИ ИГРА -->
<div id="orderGame" class="dg-overlay" style="display:none;">
    <div class="dg-window">

        <h2>Помоги Вове подготовить зерно к погрузке</h2>
        <h4>Поставь действия в правильном порядке</h4>
        <div id="orderItems">
            <div class="item" draggable="true" data-id="4">Отнести на пристань</div>
            <div class="item" draggable="true" data-id="2">Пойти к амбару</div>
            <div class="item" draggable="true" data-id="1">Взять мешок</div>
            <div class="item" draggable="true" data-id="3">Взять зерно</div>
        </div>

        <button class="dg-check" onclick="checkOrder()">Проверить</button>

    </div>
</div>

<!-- POPUP -->
<div id="resultPopup" class="dg-overlay" style="display:none;">
    <div class="dg-window" id="resultContent"></div>
</div>

<audio id="successSound" src="assets/medal.mp3"></audio>

<script>

// ===== ЗВУК =====
const sound = document.getElementById("bgSound");
const soundBtn = document.getElementById("soundBtn");

let unlocked = localStorage.getItem("audioUnlocked") === "true";

if (unlocked) {
    sound.play().catch(()=>{});
}

let soundEnabled = localStorage.getItem("sound") !== "off";

window.addEventListener("click", () => {
    if (soundEnabled) {
        sound.volume = 0.5;
        sound.play();
    }
}, { once: true });

function updateSoundUI() {
    soundBtn.src = soundEnabled
        ? "assets/sound-on.png"
        : "assets/sound-off.png";
}

updateSoundUI();

function toggleSound() {
    soundEnabled = !soundEnabled;

    if (soundEnabled) {
        sound.play();
    } else {
        sound.pause();
    }

    localStorage.setItem("sound", soundEnabled ? "on" : "off");
    updateSoundUI();
}

// ===== МЕНЮ =====
function toggleMenu() {
    menu.classList.toggle("show");
}

function resumeGame() {
    toggleMenu();
}

function goHome() {
    window.location.href = "index.html";
}

function restart() {
    window.location.reload();
}

// ===== ТЕКСТ (как в scene3) =====
const textLeft = "Делай всё по порядку, не путай! \n Сначала возьми мешок.";



let speed = 25;

function typeText(el, text, callback) {
    let i = 0;
    let interval = setInterval(() => {
        el.innerHTML += text[i];
        i++;

        if (i >= text.length) {
            clearInterval(interval);
            if (callback) callback();
        }
    }, speed);
}

window.onload = () => {
    typeText(text1, textLeft, () => {
        choiceBtn.disabled = false;
        choiceBtn.classList.add("show");
    });
};

// ПРОПУСК
document.addEventListener("click", () => {
    text1.innerHTML = textLeft;

    choiceBtn.disabled = false;
    choiceBtn.classList.add("show");
});

// ===== ТВОЯ ЛОГИКА (НЕ ТРОГАЛ) =====
let attempts = 0;

function openOrderGame() {
    document.getElementById("orderGame").style.display = "flex";
    enableDrag();
}

let dragged = null;

function enableDrag() {
    document.querySelectorAll("#orderItems .item").forEach(item => {

        item.addEventListener("dragstart", () => {
            dragged = item;
        });

        item.addEventListener("dragover", (e) => {
            e.preventDefault();
        });

        item.addEventListener("drop", () => {
            if (dragged && dragged !== item) {
                swap(dragged, item);
            }
        });
    });
}

function swap(a, b) {
    const parent = a.parentNode;
    const aNext = a.nextSibling;
    parent.insertBefore(a, b.nextSibling);
    parent.insertBefore(b, aNext);
}

function checkOrder() {
    const order = [...document.querySelectorAll("#orderItems .item")]
        .map(el => el.dataset.id)
        .join("");

    if (order === "1234") {
        showCorrect();
    } else {
        attempts++;
        showWrong();
    }
}

function showWrong() {
    resultContent.innerHTML = `
        <h2>Ошибка</h2>
        <div class="hint-box">
            <p>— Нет, так не пойдёт. Это линейный алгоритм!</p>
        </div>
        <button onclick="closeResult()">Еще раз</button>
    `;
    resultPopup.style.display = "flex";
}

function showCorrect() {
    resultContent.innerHTML = `
        <h2>Верно!</h2>
        <div class="hint-box">
            <p>— Отлично! Идем дальше.</p>
        </div>
        <button onclick="showReward()">Далее</button>
    `;
    resultPopup.style.display = "flex";
}



function showReward() {
    resultContent.innerHTML = `
        <h2>Награда!</h2>
        <img src="assets/medal-gold.png" class="result-img">
        <p>Линейный алгоритм — действия строго по порядку.</p>
        <p>Он используется, когда нужно выполнить действия последовательно. </p>
        <p> Например, при приготовлении блюда или сборке мебели.</p>
        <button onclick="goNext()">Далее</button>
    `;

    successSound.currentTime = 0;
    successSound.play();
}

function closeResult() {
    resultPopup.style.display = "none";
}

function goNext() {
    document.body.classList.add("fade-out");

    setTimeout(() => {
        window.location.href = "quest2.html";
    }, 600);
}

</script>

</body>
</html>
