<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Авторизация</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="login">

<!-- ФОН -->

<!-- TOP UI (как в игре — НЕ ТРОГАЕМ) -->
<div class="top-ui">

    <div class="left-ui">
        <a href="index.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img class="sound-btn" src="assets/sound-on.png">
        <div class="ui-btn btn-menu"></div>
    </div>

</div>

<!-- ЛОГО (кораблик + текст) -->
<div class="login-logo">
    <img src="assets/logo_menu.png" class="logo-ship">
    <div class="logo-text">КОД РЮРИКА</div>
</div>

<!-- ФОРМА -->
<div class="auth-box">

    <h2>Чтобы продолжить,<br>нужна авторизация</h2>

    <label>E-mail</label>
    <input type="text" placeholder="пример@ваш.адрес">

    <label>Пароль</label>
    <div class="password-field">
        <input type="password" placeholder="••••••••">
        <span class="eye"></span>
    </div>

    <p class="register">
        Ещё нет аккаунта?
        <a href="register.html">Зарегистрируйтесь</a>
    </p>

    <button class="login-btn">ВОЙТИ</button>

</div>

</body>
</html>
