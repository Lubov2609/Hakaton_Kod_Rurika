<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Мини-игра: Очередь</title>
<link rel="stylesheet" href="style.css">
</head>

<body class="quest7">



<!-- AUDIO -->
<audio id="bgSound" loop>
    <source src="assets/village.mp3" type="audio/mpeg">
</audio>

<audio id="successSound" src="assets/medal.mp3"></audio>

<!-- TOP UI -->
<div class="top-ui">
    <div class="left-ui">
        <a href="scene9.html" class="ui-btn btn-back"></a>
        <a href="index.html" class="ui-btn btn-home"></a>
    </div>

    <div class="right-ui">
        <img id="soundBtn" class="sound-btn" src="assets/sound-on.png" onclick="toggleSound()">
        <a href="profile.html" class="ui-btn btn-menu"></a>
    </div>
</div>

<!-- ПРАВЫЙ ПЕРСОНАЖ -->
<div class="person right-person">
    <img src="assets/vova_quest2.png" class="char-img">
</div>

<!-- АМУЛЕТ -->
<div class="amulet-block">
    <img src="assets/omylet.png" class="amulet-game">
    <div class="amulet-textq7">
Лодки заходят по порядку…<br>
И выходят в том же порядке!<br>
       Внимательней осмотри акваторию
    </div>
</div>

<!-- КОРАБЛИ -->
<div class="chests">
    <img src="assets/kor_1.png" class="chest" draggable="true" data-id="1">
    <img src="assets/kor_2.png" class="chest" draggable="true" data-id="2">
    <img src="assets/kor_3.png" class="chest" draggable="true" data-id="3">
</div>

<!-- БАШНЯ -->
<div class="tower-container">
    <div id="queue" class="queue"></div>
</div>

<!-- POPUP -->
<div id="resultPopup" class="dg-overlay" style="display:none;">
    <div class="dg-window" id="resultContent"></div>
</div>

<audio id="successSound" src="assets/medal.mp3"></audio>
<!-- ТЕСТ -->
<div id="testModal" class="dg-overlay" style="display:none;">
    <div class="dg-window ancient-test">

        <h2>Испытание мудреца</h2>
        <div class="test-timer">
            Время: <span id="testTime">0</span> сек
        </div>

        <div id="testContent"></div>

    </div>
</div>
<script>
const queueEl = document.getElementById("queue");

// звуки
const placeSound = new Audio("assets/place.mp3");
const hitSound = new Audio("assets/hit.mp3");
/* ===== СТЕК ===== */
/* ===== ОЧЕРЕДЬ ===== */
let queue = [];
let steps = [];
let attempts = 0;

// правильная последовательность
const correct = [
    "push2","push3","push1",
    "shift2","shift3","shift1"
];

queueEl.addEventListener("dragover", (e) => {
    e.preventDefault(); // 🔥 БЕЗ ЭТОГО НЕ РАБОТАЕТ
});
/* ===== DRAG ===== */
let draggedId = null;

document.querySelectorAll(".chest").forEach(el => {

    el.addEventListener("dragstart", (e) => {
        draggedId = el.dataset.id;
        e.dataTransfer.setData("text/plain", draggedId);
    });

});

/* ===== DROP ===== */
queueEl.addEventListener("drop", (e) => {
    e.preventDefault();

    let id = e.dataTransfer.getData("text/plain");

    if (!id) return;

    let element = document.querySelector(`.chest[data-id="${id}"]`);

    if (!element) return;

    queue.push(id);
    steps.push("push" + id);

    placeSound.currentTime = 0;
    placeSound.play();

    queueEl.appendChild(element);

    check();
});

/* ===== POP ===== */
queueEl.addEventListener("click", () => {

    if (queue.length === 0) return;

    let first = queueEl.firstElementChild;

    let id = queue.shift();
    steps.push("shift" + id);

    // звук
    hitSound.currentTime = 0;
    hitSound.play();

    document.querySelector(".chests").appendChild(first);

    check();
});

/* ===== ПРОВЕРКА ===== */
function check() {

    for (let i = 0; i < steps.length; i++) {
        if (steps[i] !== correct[i]) {
            return showFail();
        }
    }

    if (steps.length === correct.length) {
        showReward();
    }
}

/* ===== ОШИБКА ===== */
function showFail() {

    attempts++;

    let text = attempts == 1
        ? "Подсказка: смотри на подсказку амулета"
        : attempts == 2
        ? "Очередь: первый пришёл — первый ушёл"
        : "Попробуй позже";

    let button = attempts >= 3
        ? `<button onclick="exitGame()">Выйти</button>`
        : `<button onclick="exitGame()">Еще раз</button>`;

    resultContent.innerHTML = `
        <h2>Ошибка</h2>
        <div class="hint-box"><p>${text}</p></div>
        ${button}
    `;

    resultPopup.style.display = "flex";
}

function retry() {
    resultPopup.style.display = "none";
}

/* ===== НАГРАДА ===== */
function showReward() {

    let img = attempts === 0
        ? "assets/medal-gold.png"
        : attempts === 1
        ? "assets/medal-silvers.png"
        : "assets/medal-bronse.png";

    resultContent.innerHTML = `
        <h2>Награда!</h2>
        <img src="${img}" class="result-img">

        <p>Очередь — структура данных</p>
        <p>Первый пришёл — первый ушёл (FIFO)</p>
        <p><a href="https://ru.wikipedia.org/wiki/Очередь_(программирование)" target="_blank">Подробнее</a> </p>


        <button onclick="goNext()">Далее</button>
    `;

    resultPopup.style.display = "flex";

    successSound.currentTime = 0;
    successSound.play();
}

function exitGame() {
    location.reload();
}

/* ===== ПЕРЕХОД ===== */
// ===== ПЕРЕХОД =====
function goNext() {
    resultPopup.style.display = "none";
    startQuestTest();
}
// ===== ТЕСТ ПО ТЕМЕ =====

const questQuestions = [
{
q:"1. Что такое линейный алгоритм?",
a:["Случайные действия","Шаги по порядку","Повторение"],
c:1
},
{
q:"2. Что важно в линейном алгоритме?",
a:["Порядок шагов","Музыка","Цвет"],
c:0
},
{
q:"3. Что будет при нарушении порядка?",
a:["Ошибка","Ничего","Ускорение"],
c:0
}
];

let tq = 0;
let ts = 0;
let ta = null;
let timerSec = 0;
let timerInt;

function startQuestTest(){

    testModal.style.display = "flex";

    timerSec = 0;
    timerInt = setInterval(()=>{
        timerSec++;
        testTime.innerText = timerSec;
    },1000);

    renderQuestQuestion();
}

function renderQuestQuestion(){

    let q = questQuestions[tq];

    let html = `
        <h3>${q.q}</h3>
        <div class="test-answers">
    `;

    q.a.forEach((ans,i)=>{
        html += `<button onclick="pickAns(${i},this)">${ans}</button>`;
    });

    html += `
        </div>
        <button class="test-next" onclick="nextQuest()">Ответить</button>
    `;

    testContent.innerHTML = html;
}

function pickAns(i,el){

    ta = i;

    document.querySelectorAll(".test-answers button")
    .forEach(btn=>btn.classList.remove("active"));

    el.classList.add("active");
}

function nextQuest(){

    if(ta===null) return;

    if(ta===questQuestions[tq].c) ts++;

    ta = null;
    tq++;

    if(tq >= questQuestions.length){
        finishQuestTest();
    } else {
        renderQuestQuestion();
    }
}

function finishQuestTest(){

    clearInterval(timerInt);

    let rank = "";

    if(ts==5) rank="Мудрец алгоритмов!";
    else if(ts>=4) rank="Отличный результат!";
    else if(ts>=3) rank="Неплохо!";
    else rank="Нужно ещё учиться.";

    testContent.innerHTML = `
        <div class="test-result">
            Правильных ответов: <b>${ts}/3</b><br>
            ${rank}<br><br>
            Переход обратно
        </div>
    `;

    setTimeout(()=>{
        window.location.href = "errors.html";
    },4000);
}

</script>

</body>
</html>
